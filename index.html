<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SFTP Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SVGアイコン定義 -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
        </symbol>
        <symbol id="icon-eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
        </symbol>
    </svg>

    <div class="container">
        <button id="importSteBtn"></button>
        
        <div class="form-group">
            <label for="host"></label>
            <input type="text" id="host">
        </div>

        <div class="form-group">
            <label for="username"></label>
            <input type="text" id="username">
        </div>

        <div class="form-group">
            <label for="password"></label>
            <div class="password-container">
                <input type="password" id="password">
                <button type="button" id="togglePassword" class="toggle-password">
                    <svg class="icon"><use href="#icon-eye"/></svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="remotePath"></label>
            <input type="text" id="remotePath">
        </div>

        <div class="form-group">
            <label for="folderPath"></label>
            <div class="input-with-button">
                <input type="text" id="folderPath" readonly>
                <button id="selectFolderBtn"></button>
            </div>
        </div>

        <div class="form-group checkbox">
            <input type="checkbox" id="uploadOnSave" checked>
            <label for="uploadOnSave"></label>
        </div>

        <div class="button-group">
            <button id="generateBtn" class="primary-button"></button>
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
